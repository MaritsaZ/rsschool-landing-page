<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Resource Coffee House menu - choose your favorite coffee, tea, and dessert."
    >
    <title>Resource Coffee House - Menu</title>

    <link
        rel="icon"
        href="../assets/images/logo.svg"
        type="image/svg+xml"
    >

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="header">
        <div class="container header-menu">

            <a
                class="logo"
                href="../index.html"
                aria-label="Resource Coffee House home"
            >
                <img
                    src="../assets/images/logo.svg"
                    alt="Resource Coffee House"
                >
            </a>

            <nav class="nav" aria-label="Main navigation">
                <ul class="nav-list">
                    <li>
                        <a
                            class="nav-link"
                            href="../index.html#favorite-coffee"
                        >
                            Favorite coffee
                        </a>
                    </li>

                    <li>
                        <a
                            class="nav-link"
                            href="../index.html#about"
                        >
                            About
                        </a>
                    </li>

                    <li>
                        <a
                            class="nav-link"
                            href="../index.html#mobile-app"
                        >
                            Mobile app
                        </a>
                    </li>

                    <li>
                        <a
                            class="nav-link"
                            href="#contacts"
                        >
                            Contact us
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="header-actions">
                <button
                    class="theme-switch"
                    type="button"
                    aria-label="Switch theme"
                >
                    <span class="theme-option theme-option-light">
                        <img
                            class="theme-icon-sun"
                            src="../assets/icons/sun.svg"
                            alt=""
                        >
                    </span>

                    <span class="theme-option theme-option-dark">
                        <img
                            class="theme-icon-moon"
                            src="../assets/icons/moon.svg"
                            alt=""
                        >
                    </span>
                </button>

                <span class="menu-link">
                    <span>Menu</span>
                    <img
                        class="menu-icon"
                        src="../assets/icons/coffee-cup.svg"
                        alt=""
                    >
                </span>

                <button
                    class="burger-button"
                    type="button"
                    aria-label="Open menu"
                    aria-expanded="false"
                >
                    <span></span>
                    <span></span>
                </button>
            </div>

        </div>
    </header>

    <main>
        <section class="menu">
            <div class="container menu-container">

                <h1 class="menu-title">
                    Behind each of our cups hides an
                    <span>amazing surprise</span>
                </h1>

                <div class="menu-tabs">
                    <button
                        class="menu-tab menu-tab-active"
                        type="button"
                    >
                        Coffee
                    </button>

                    <button
                        class="menu-tab"
                        type="button"
                    >
                        Tea
                    </button>

                    <button
                        class="menu-tab"
                        type="button"
                    >
                        Dessert
                    </button>
                </div>

                <div class="menu-grid">
                    <!-- Product cards will be added next -->
                </div>

            </div>
        </section>
    </main>

    <footer class="contacts" id="contacts">
        <div class="container contacts-container">

            <div class="contacts-offer">
                <h2 class="contacts-title">
                    Sip, Savor, Smile.<br>
                    <span>It’s coffee time!</span>
                </h2>

                <div class="socials">
                    <a
                        class="social-button"
                        href="https://twitter.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Twitter"
                    >
                        <img
                            src="../assets/icons/twitter.svg"
                            alt=""
                        >
                    </a>

                    <a
                        class="social-button"
                        href="https://www.instagram.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Instagram"
                    >
                        <img
                            src="../assets/icons/instagram.svg"
                            alt=""
                        >
                    </a>

                    <a
                        class="social-button"
                        href="https://www.facebook.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Facebook"
                    >
                        <img
                            src="../assets/icons/facebook.svg"
                            alt=""
                        >
                    </a>
                </div>
            </div>

            <div class="contacts-info">
                <h3 class="contacts-subtitle">
                    Contact us
                </h3>

                <div class="contact-list">

                    <a
                        class="contact-item"
                        href="https://maps.google.com/?q=8558+Green+Rd,+LA"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span class="contact-icon">
                            <img
                                src="../assets/icons/location.svg"
                                alt=""
                            >
                        </span>

                        <span>8558 Green Rd., LA</span>
                    </a>

                    <a
                        class="contact-item"
                        href="tel:+16035550123"
                    >
                        <span class="contact-icon">
                            <img
                                src="../assets/icons/phone.svg"
                                alt=""
                            >
                        </span>

                        <span>+1 (603) 555-0123</span>
                    </a>

                    <div class="contact-item">
                        <span class="contact-icon">
                            <img
                                src="../assets/icons/clock.svg"
                                alt=""
                            >
                        </span>

                        <span>Mon-Sat: 9:00–23:00</span>
                    </div>

                </div>
            </div>

        </div>
    </footer>

    <script src="../js/main.js"></script>
</body>

</html>
