<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Coffee House</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-menu">

                <a class="logo" href="./index.html">
                    <img
                        src="./assets/images/logo.svg"
                        alt="Resource Coffee House Logo">
                </a>

                <nav class="nav">
                    <ul class="nav-list">
                        <li>
                            <a class="nav-link" href="#favorite-coffee">
                                Favorite coffee
                            </a>
                        </li>

                        <li>
                            <a class="nav-link" href="#about">
                                About
                            </a>
                        </li>

                        <li>
                            <a class="nav-link" href="#mobile-app">
                                Mobile app
                            </a>
                        </li>

                        <li>
                            <a class="nav-link" href="#contacts">
                                Contact us
                            </a>
                        </li>
                    </ul>
                </nav>

                <div class="header-actions">
                    <button
                        class="theme-switch"
                        type="button"
                        aria-label="Switch theme"
                    >
                        <img
                            class="theme-icon theme-icon-sun"
                            src="./assets/images/sun.svg"
                            alt=""
                        >
                        <img
                            class="theme-icon theme-icon-moon"
                            src="./assets/images/moon.svg"
                            alt=""
                        >
                    </button>

                    <a class="menu-link" href="./menu/">
                        <span>Menu</span>
                        <img
                            class="menu-icon"
                            src="./assets/images/coffee-cup.svg"
                            alt=""
                        >
                    </a>
                </div>

            </div>
        </div>
    </header>

    <main>
        <!-- Sections will be added step by step -->
    </main>
</body>

</html>
